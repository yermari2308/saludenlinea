name: Keep Alive

# Hace ping al backend cada ~10 minutos para que el plan gratis de Render
# no se duerma tras 15 min de inactividad.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping servidor
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://saludenlinea.onrender.com/api)
          echo "Respuesta HTTP: $code ($(date -u))"
          [ "$code" = "200" ] && echo "Backend activo" || echo "Backend despertando ($code)"
